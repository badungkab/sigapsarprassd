<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SIGAP SARPRAS-SD BADUNG</title>
<link rel="stylesheet" href="sarpras.css">
</head>
<body class="login-wrap">
<div class="login-card">
  <h2>SIGAP SARPRAS SD</h2>
  <p>Sistem Informasi Gerakan Akselerasi Pengelolaan Sarana dan Prasarana SD</p>
  <div class="err" id="errBox"></div>
  <div class="form-box">
    <label>Username</label><input id="username">
    <label>Password</label><input type="password" id="password">
    <label>Login Sebagai</label>
    <select id="role"><option value="admin">Administrator</option><option value="kepsek">Kepala Sekolah</option><option value="pimpinan">Pimpinan</option></select>
    <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="doLogin()">LOGIN</button>
  </div>
</div>
<script src="sarpras.js"></script>
<script>
if(Auth.current())location.href='dashboard.html';
async function doLogin(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,rs=document.getElementById('role').value,err=document.getElementById('errBox');err.style.display='none';
 if(!u||!p){err.textContent='❌ Wajib diisi.';err.style.display='block';return;}
 const user=await doVerify(u,p);
 if(!user){err.textContent='❌ Username/password salah.';err.style.display='block';return;}
 if(user.role!==rs){err.textContent='❌ Role tidak sesuai: '+ROLES[user.role].label;err.style.display='block';return;}
 Auth.login(user);location.href='dashboard.html';}
</script>
</body>
</html>
