<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Sekolah - SIGAP SARPRAS-SD BADUNG</title>
<link rel="stylesheet" href="sarpras.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="brand2">SIGAP SARPRAS SD</div><nav id="sidebar-menu"></nav></aside>
  <main class="main">
    <div class="topbar"><h1>🏫 Data Sekolah</h1><span id="header-username" style="font-size:13px;color:#64748b;"></span></div>
    <div class="toolbar" id="sToolbar"></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Nama Sekolah</th><th>Kecamatan</th><th>Alamat</th><th>Lat,Lng</th><th>Aksi</th></tr></thead><tbody id="sTable"></tbody></table></div>
  </main>
</div>
<div class="modal-backdrop hidden" id="mSek"><div class="modal"><h3 id="mSekT">Tambah Sekolah</h3>
  <div class="form-box"><div class="f2"><div><label>Nama Sekolah *</label><input id="f_nama"><label>Kecamatan *</label><input id="f_kec"><label>Alamat</label><input id="f_alamat"></div><div><label>Latitude</label><input id="f_lat"><label>Longitude</label><input id="f_lng"></div></div>
  <div style="margin-top:14px;text-align:right;"><button class="btn btn-secondary" onclick="hideM('mSek')">Batal</button><button class="btn btn-primary" onclick="saveSek()">SIMPAN</button></div></div></div></div>
<script src="sarpras.js"></script>
<script>
let eId=null;
if(requireAuth('sekolah')){renderMenu('sekolah');withSync(load);}
function hideM(id){document.getElementById(id).classList.add('hidden');}
function load(){buildToolbar('sToolbar',{createLabel:'➕ Tambah Sekolah',onCreate:()=>editSek(null),onExport:()=>exportExcel(DATA.sekolah,'data-sekolah','Sekolah'),onPrint:()=>printTable('Data Sekolah',['id','nama_sekolah','kecamatan','alamat'],DATA.sekolah)});
 document.getElementById('sTable').innerHTML=DATA.sekolah.map(s=>`<tr><td>${s.id}</td><td><strong>${s.nama_sekolah}</strong></td><td>${s.kecamatan}</td><td>${s.alamat||'-'}</td><td>${s.lat||0}, ${s.lng||0}</td><td>${can('edit')?`<button class="btn btn-warning btn-sm" onclick="editSek('${s.id}')">Edit</button>`:''} ${can('delete')?`<button class="btn btn-danger btn-sm" onclick="delSek('${s.id}')">Hapus</button>`:''}</td></tr>`).join('');}
function editSek(id){eId=id;const s=id?DATA.sekolah.find(x=>x.id===id):null;document.getElementById('mSekT').textContent=s?'Edit Sekolah':'Tambah Sekolah';['f_nama','f_kec','f_alamat','f_lat','f_lng'].forEach(i=>document.getElementById(i).value='');if(s){document.getElementById('f_nama').value=s.nama_sekolah;document.getElementById('f_kec').value=s.kecamatan;document.getElementById('f_alamat').value=s.alamat||'';document.getElementById('f_lat').value=s.lat||'';document.getElementById('f_lng').value=s.lng||'';}document.getElementById('mSek').classList.remove('hidden');}
async function saveSek(){const nama=document.getElementById('f_nama').value.trim(),kec=document.getElementById('f_kec').value.trim();if(!nama||!kec)return alert('Nama & kecamatan wajib.');
 const rec={nama_sekolah:nama,kecamatan:kec,alamat:document.getElementById('f_alamat').value,lat:+document.getElementById('f_lat').value||0,lng:+document.getElementById('f_lng').value||0,created_at:today()};
 if(eId){Object.assign(DATA.sekolah.find(x=>x.id===eId),rec);}else{DATA.sekolah.push({id:nextSeq(DATA.sekolah,'S',3),...rec});}
 const r=await pushMaster();alert(r.ok?'Tersimpan.':'Gagal.');if(r.ok){hideM('mSek');withSync(load);}}
async function delSek(id){if(!confirm('Hapus sekolah?'))return;DATA.sekolah=DATA.sekolah.filter(s=>s.id!==id);const r=await pushMaster();if(r.ok)withSync(load);}
</script>
</body>
</html>
